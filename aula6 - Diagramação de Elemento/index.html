<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Elemento</title>
    <style>
        .container{
            width: 400px;
            height: 600px;
            border: 5px solid black;
            text-align: center;
            position: relative;
        }
        img{
            width: 100px;
            height: 100px;
            background-color: dodgerblue;
            position: fixed;
            left: 50px;
        }
        span{
            font-size: 20px;
            vertical-align: top;
        }
        .item1{
            width: 150px;
            height: 150px;
            background-color: blue;
            display: inline-block;
            position: relative;
            left: 30px;
            z-index: 2;
        }
        .item2{
            width: 150px;
            height: 150px;
            background-color: red;
            display: inline-block;
            position: absolute;
            right: 0px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. At unde odit fugit. Non impedit fuga dolor eos delectus rerum! Enim amet debitis eos tempora accusantium! Quibusdam tempore veritatis dolores quos?</p>
        <button>Clique</button>
    <div>
        <img>
        <span>Exemplo vertical-align</span>
    </div>
    <div class="item1">ITEM 1</div>
    <div class="item2">ITEM 2   </div>
    </div>
</body>
</html>
