<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de links</title>
    <style>
        body{
            background-color: black;
        }
        h1{
            color: hotpink;
        }
        a:link{
            color: blue;
        }
        a:visited{
            color: yellow;
        }
        a:hover{
            color: red;
            font-size: 30px;
        }
        a:active{
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Formatação de Links com CSS</h1>
    <p><a href="../assets/mo paz.jpg">Clique</a></p>
</body>
</html>
