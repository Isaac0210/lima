<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3</title>
</head>

<body>

    <!--Cabeçalho-->
    <header>
        <h1>Cores, Imagens e Links</h1>
    </header>
    <main>
        <!--Cores em HTML-->
        <section>
            <h2>Formatos de Cor no CSS:</h2>
            <h3 style="color: #FF5733;">Título em Hexadecimal</h1>
            <h3 style="color: rgb(0,128,255);">Título com cor RGB</h1>
            <h3 style="color: rgba(0,128,0,0.5);">Título com cor em RGBA</h1>
        </section>
        <hr>
        <!--Cor em elemento de texto e fundo do texto-->
        <section>
            <p style="color: blue;">Texto em uma cor específica</p>
            <p style="background-color: rgb(255,255,0); color: green;">Fundo do texto em uma cor específica</p>
        </section>
        <hr>
        <section>
            <!--Imagem como elemento de página-->
            <img src="assets/fundo.jpg" alt="Teste" title="Teste" style="width: 700px;">
            <hr>
        </section>
        <!--Imagem como Background-->
        <section>
            <div style="border: 1px solid red; width: 500px; height: 500px; color: yellow; text-align: center; background-image: url('assets/mo\ paz.jpg');background-size: 600px 600px;">
                <h2>Imagem como background</h2>
                <p>Esta seção tem uma imagem de fundo</p>
                
            </div>
        </section>
    </main>
</body>

</html>
